        const fitBtn = document.getElementById('fit-btn');
        const canvasWrapper = document.querySelector('.canvas-wrapper');
        let isFitMode = false;

        // Icons
        const fitIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
        const originalSizeIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" /><path d="M15 3h6v6M9 21H3v-6"/></svg>'; // Approx icon for "Manual/Original"

        // Load saved fit mode
        const savedFitMode = localStorage.getItem('magnifyglass-viewer-fitmode');
        if (savedFitMode === 'true') {
            toggleFitMode(true);
        }

        fitBtn.addEventListener('click', () => {
            toggleFitMode(!isFitMode);
        });

        function toggleFitMode(active) {
            isFitMode = active;
            localStorage.setItem('magnifyglass-viewer-fitmode', isFitMode);

            const canvasSection = canvasWrapper.closest('.canvas-section');

            if (isFitMode) {
                canvas.classList.add('fit-mode');
                canvasWrapper.classList.add('fit-active');
                if (canvasSection) canvasSection.classList.add('fit-mode-section');

                fitBtn.title = "Restore Manual Size";
                fitBtn.classList.add('active'); // Optional styling
                // We don't change icon, or maybe we do? 
                // Let's keep the "arrows out" to mean "currently fit"? 
                // Or "arrows out" means "Click to Fit"?
                // Let's toggle icon for clarity.
                // Actually, let's just highlight the button/change title.
                fitBtn.style.color = 'var(--text-primary)';
                fitBtn.style.background = 'var(--bg-elevated)';
            } else {
                canvas.classList.remove('fit-mode');
                canvasWrapper.classList.remove('fit-active');
                if (canvasSection) canvasSection.classList.remove('fit-mode-section');

                fitBtn.title = "Fit to Container";
                fitBtn.style.color = '';
                fitBtn.style.background = '';
            }
        }

        // Resize functionality
        const resizeHandle = document.getElementById('resize-handle');
        // canvasWrapper already selected above
        let isResizing = false;
        let startX, startY, startWidth, startHeight;

        // Load saved size
        const savedSize = localStorage.getItem('magnifyglass-viewer-size');
        if (savedSize) {
            try {
                const { width, height } = JSON.parse(savedSize);
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
            } catch (e) { }
        }

        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            startX = e.clientX;
            startY = e.clientY;
            startWidth = canvas.offsetWidth;
            startHeight = canvas.offsetHeight;
            document.body.style.cursor = 'nwse-resize';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            // Keep aspect ratio by using the larger delta
            const delta = Math.max(deltaX, deltaY);
            const aspectRatio = startWidth / startHeight;

            let newWidth = Math.max(200, startWidth + delta);
            let newHeight = newWidth / aspectRatio;

            // Constrain to viewport
            const maxW = window.innerWidth - 400;
            const maxH = window.innerHeight - 100;
            if (newWidth > maxW) {
                newWidth = maxW;
                newHeight = newWidth / aspectRatio;
            }
            if (newHeight > maxH) {
                newHeight = maxH;
                newWidth = newHeight * aspectRatio;
            }

            canvas.style.width = `${newWidth}px`;
            canvas.style.height = `${newHeight}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                // Save size
                localStorage.setItem('magnifyglass-viewer-size', JSON.stringify({
                    width: canvas.offsetWidth,
                    height: canvas.offsetHeight
                }));
            }
        });
    </script>
</body>
